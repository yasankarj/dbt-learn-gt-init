sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        description: Raw payment data from the stripe database
        columns:
          - name: id
            description: The primary key for the payment
            data_tests:
              - not_null
              - unique
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}