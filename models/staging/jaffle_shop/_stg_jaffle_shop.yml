models:
  - name: stg_jaffle_shop__customers
    description: one unique customer per row
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
        description: the primary key for the customer
      - name: first_name
        description: the first name of the customer
        data_tests:
          - not_null
      - name: last_name
        description: the last name of the customer
        data_tests:
          - not_null

  - name: stg_jaffle_shop__orders
    description: one unique order per row
    columns:
      - name: order_id
        description: the primary key for the order
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: the customer id for the order
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: the date the order was placed
        data_tests:
          - not_null
      - name: status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']